{{- if and .Values.postgres.enabled .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "model-royale.postgresName" . }}-data
  labels:
    {{- include "model-royale.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.postgres.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "model-royale.postgresName" . }}
  labels:
    {{- include "model-royale.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-royale.postgresName" . }}
  labels:
    {{- include "model-royale.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "model-royale.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "model-royale.postgresSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "model-royale.postgresName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: {{ .Values.postgres.env.databaseKey }}
              value: {{ .Values.postgres.auth.database | quote }}
            - name: {{ .Values.postgres.env.userKey }}
              value: {{ .Values.postgres.auth.username | quote }}
            - name: {{ .Values.postgres.env.passwordKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "model-royale.secretName" . }}
                  key: POSTGRES_PASSWORD
            {{- if .Values.postgres.env.pgdata }}
            - name: PGDATA
              value: {{ .Values.postgres.env.pgdata | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.postgres.dataMountPath }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "model-royale.postgresName" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-royale.postgresName" . }}
  labels:
    {{- include "model-royale.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "model-royale.postgresSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
