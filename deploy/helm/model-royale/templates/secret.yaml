{{- if not .Values.secrets.existingSecret }}
{{- $secretName := include "model-royale.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $admin := .Values.secrets.adminPassword }}
{{- $key := .Values.secrets.secretKey }}
{{- $pg := .Values.secrets.postgresPassword }}
{{- if and (eq $admin "") $existing (hasKey $existing.data "ADMIN_PASSWORD") }}
{{- $admin = index $existing.data "ADMIN_PASSWORD" | b64dec }}
{{- end }}
{{- if and (eq $key "") $existing (hasKey $existing.data "SECRET_KEY") }}
{{- $key = index $existing.data "SECRET_KEY" | b64dec }}
{{- end }}
{{- if and (eq $pg "") $existing (hasKey $existing.data "POSTGRES_PASSWORD") }}
{{- $pg = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
{{- if eq $admin "" }}{{ $admin = randAlphaNum 20 }}{{ end }}
{{- if eq $key "" }}{{ $key = randAlphaNum 32 }}{{ end }}
{{- if eq $pg "" }}{{ $pg = randAlphaNum 20 }}{{ end }}
{{- if and .Values.postgres.enabled .Values.sqlite.enabled }}
{{- fail "Enable either postgres or sqlite, not both" }}
{{- end }}
{{- $dbUrl := .Values.databaseUrl }}
{{- if .Values.postgres.enabled }}
{{- $dbUrl = printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.auth.username $pg (include "model-royale.postgresName" .) .Values.postgres.auth.database }}
{{- else if .Values.sqlite.enabled }}
{{- $dbUrl = printf "sqlite:///%s/royale.db" .Values.sqlite.mountPath }}
{{- end }}
{{- if eq $dbUrl "" }}
{{- fail "Set sqlite.enabled=true, postgres.enabled=true, or databaseUrl" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "model-royale.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ $admin | quote }}
  SECRET_KEY: {{ $key | quote }}
  POSTGRES_PASSWORD: {{ $pg | quote }}
  DATABASE_URL: {{ $dbUrl | quote }}
{{- end }}
