apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "model-royale.fullname" . }}-nginx
  labels:
    {{- include "model-royale.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        location /api/ {
          proxy_pass http://{{ include "model-royale.apiName" . }}:{{ .Values.api.service.port }};
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_read_timeout 3600s;
        }
        location /healthz {
          proxy_pass http://{{ include "model-royale.apiName" . }}:{{ .Values.api.service.port }}/healthz;
        }
        location / {
          try_files $uri /index.html;
        }
      }
    }
